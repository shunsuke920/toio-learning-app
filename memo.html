<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五感で学べる英語学習</title>
    <link rel="stylesheet" href="memo.css"> <!-- CSSをまとめて読み込み -->
    <!-- 📘 メモ入力フォーム -->
<!-- ✅ 検索バーとフィルターを一覧の上にまとめて配置 -->

<!-- 📝 メモの入力フォーム -->
<div id="memoForm">
  <h2>📘 新しい表現をメモしよう</h2>
  <input type="text" id="phraseInput" placeholder="Enter a phrase" />
  <button id="saveMemoButton">💾 保存する</button>
</div>

<!-- 🗒️ メモ一覧 -->
<!-- 🔍 検索バー + タグフィルタ（もし使ってたら） -->
<div id="memoControls">
  <input type="text" id="searchInput" placeholder="フレーズを検索" oninput="renderMemoList()" />
  <!-- タグセレクトもここに置くと自然 -->
</div>

<!-- 🗒️ メモ一覧本体 -->
<div id="memoList">
  <h2>🗒️ あなたのメモ一覧</h2>
  <ul id="memoItems"></ul>
</div>




<script>
    // ✅ メモを保存する関数
function saveMemo() {
  const phrase = document.getElementById("phraseInput").value.trim();
 const tag = ""; // タグを使わないなら完全に固定でOK


  if (!phrase) {
    alert(" 表現を入力してください！");
    return;
  }

  // 現在の保存済みメモを取得
  const saved = JSON.parse(localStorage.getItem("myPhrases") || "[]");

  // 新しいメモを作成
  const newMemo = {
    phrase: phrase,
    tag: tag,
    created: new Date().toISOString(),
  };

  // 保存して再度ローカルストレージに書き込む
  saved.push(newMemo);
  localStorage.setItem("myPhrases", JSON.stringify(saved));

  // 入力欄をクリア
  document.getElementById("phraseInput").value = "";

  alert("✅ メモを保存しました！");
  renderMemoList();
  console.log("保存したフレーズ:",phrase);
}

// ✅ ボタンのクリックイベントを設定
document.getElementById("saveMemoButton").addEventListener("click", saveMemo);

function renderMemoList() {
  const listContainer = document.getElementById("memoItems");
  const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
  listContainer.innerHTML = "";

  const saved = JSON.parse(localStorage.getItem("myPhrases") || "[]");

  const filtered = saved.filter(memo => {
    const matchKeyword = memo.phrase.toLowerCase().includes(keyword);
    return matchKeyword;
  });

  filtered.forEach((memo, index) => {
    const li = document.createElement("li");
    li.innerHTML = `
  <div class="memo-text"><strong>${memo.phrase}</strong></div>
  <div class="memo-actions">
    <button onclick="speakPhrase('${memo.phrase.replace(/'/g, "\\'")}')">🔊再生</button>
    <button onclick="startRecognition('${memo.phrase.replace(/'/g, "\\'")}')">🎤話す</button>
    <button onclick="deleteMemo(${index})">🗑️削除</button>
  </div>
`;

    listContainer.appendChild(li);
  });

  console.log("現在の保存データ:", saved);
}



// ✅ メモを削除する関数
function deleteMemo(index) {
  const saved = JSON.parse(localStorage.getItem("myPhrases") || "[]");
  saved.splice(index, 1); // 指定したメモを削除
  localStorage.setItem("myPhrases", JSON.stringify(saved));
  renderMemoList(); // 再描画
}
renderMemoList(); // 保存後に一覧も更新
window.addEventListener("load", renderMemoList);


// ✅ TTSで読み上げる関数
function speakPhrase(text) {
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-US"; // 発音の質を上げるため英語設定
  utterance.rate = 1.0;
  speechSynthesis.speak(utterance);
}

// ✅ normalize：小文字化して記号などを除去
function normalizeText(text) {
  return text
    .toLowerCase()
    .replace(/[.,!?'"“”‘’]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

// ✅ 音声認識を開始する関数
function startRecognition(targetPhrase) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert("❌ このブラウザは音声認識に対応していません");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.start();
  console.log("🎤 音声認識開始...");

  recognition.onresult = (event) => {
    const spoken = event.results[0][0].transcript;
    console.log("🎧 認識結果:", spoken);

    const normalizedTarget = normalizeText(targetPhrase);
    const normalizedSpoken = normalizeText(spoken);

    if (normalizedSpoken === normalizedTarget || normalizedSpoken.includes(normalizedTarget)) {
      alert("✅ 発音バッチリ！Great job!");
      // 🔽 Toioと連携するならここでLEDや動作を呼び出す
    } else {
      alert(`❌ 違ったよ！聞こえたのは: "${spoken}"`);
    }
  };

  recognition.onerror = (e) => {
    alert("⚠️ 音声認識エラー: " + e.error);
  };
}

</script>
